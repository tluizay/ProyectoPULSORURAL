{% extends "base.html" %}
{% load static %}

{% block titulo %}
PULSO RURAL - Contraseña Actualizada
{% endblock %}

{% block contenido %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            
            <!-- Tarjeta con el diseño unificado de Pulso Rural -->
            <div class="card shadow-sm border-0 bg-light text-center">
                
                <!-- Cabecera de la tarjeta con imagen y título -->
                <div class="card-header bg-white py-4 border-0">
                    <img src="{% static 'img/icon.png' %}" alt="Pulso Rural Icon" class="mb-3" style="height: 60px; width: auto;">
                    <h4 class="card-title mb-0 fw-semibold text-success">
                        ¡Contraseña restablecida!
                    </h4>
                </div>

                <!-- Cuerpo de la tarjeta con el mensaje de éxito -->
                <div class="card-body bg-white px-4 pb-4 pt-2 rounded-bottom">
                    
                    <div class="mb-4 text-success">
                        <i class="bi bi-check-circle display-4 opacity-75"></i>
                    </div>

                    <p class="text-muted small mb-4">
                        Tu contraseña se ha cambiado correctamente. Ya puedes iniciar sesión con tu nueva clave de acceso.
                    </p>

                    <!-- Botón de acción -->
                    <div class="d-grid">
                        <a href="{% url 'login' %}" class="btn btn-success py-2 fw-semibold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar sesión
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </div>
</div>
{% endblock %}
